name: Magenta TV EPG Builder v12.09.2026

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TZ: Europe/Athens

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests

      - name: Fetch Magenta TV EPG
        run: |
          python fetch_channels.py

      - name: Generate XML
        run: |
          python generate_epg.py

      - name: Generate M3U
        run: |
          python generate_m3u.py

      - name: Debug
        run: |
          echo "===== DATA DIRECTORY ====="
          ls -lah data/

          echo
          echo "===== FILE SIZES ====="
          du -h data/*

          echo
          echo "===== QUICK COUNTS ====="
          echo -n "XML channels: "
          grep -c '<channel id=' data/epg.xml || true

          echo -n "XML programmes: "
          grep -c '<programme ' data/epg.xml || true

          echo -n "M3U channels: "
          grep -c '^#EXTINF:' data/channels.m3u || true

          echo
          echo "===== XML HEADER ====="
          head -n 20 data/epg.xml || true

          echo
          echo "===== M3U HEADER ====="
          head -n 20 data/channels.m3u || true

      - name: Commit & Push
        run: |
          git config user.name "EPG Bot"
          git config user.email "bot@github.com"

          git add -A

          git commit --allow-empty \
            -m "Magenta TV EPG $(date +'%Y-%m-%d %H:%M')"

          git push
